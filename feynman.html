<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070a0f">
<title>费曼讲解机</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070a0f;--panel:#0e141d;--panel2:#141c27;
  --line:#1c2734;--line2:#263547;
  --text:#e8eef6;--dim:#7c8ea3;--dim2:#5a6a7d;
  --accent:#3ddc97;--accent-d:#26b57a;--accent2:#7c9cff;
  --warn:#ffb454;--danger:#ff6b6b;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.65;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(61,220,151,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(61,220,151,.035) 1px,transparent 1px);
  background-size:24px 24px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(720px 420px at 50% -12%,rgba(61,220,151,.10),transparent 70%);
}
#app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
}
.view{flex:1;display:none;flex-direction:column;overflow:hidden;min-height:0}
.view.on{display:flex}
.scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(44px + env(safe-area-inset-bottom));
}

/* ---------- 通用控件 ---------- */
.btn{
  border:none;border-radius:14px;font-size:15px;font-weight:600;
  padding:13px 18px;cursor:pointer;font-family:inherit;
  background:var(--panel2);color:var(--text);transition:.18s;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#04140d;box-shadow:0 6px 24px -8px rgba(61,220,151,.7)}
.btn.primary:disabled{opacity:.4;box-shadow:none}
.btn.big{width:100%;padding:16px;font-size:16.5px;border-radius:16px}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim);font-weight:500;font-size:14px;padding:11px}
.icon-btn{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;border:none;
  background:transparent;color:var(--text);font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.icon-btn:active{background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.lbl{display:block;font-size:12.5px;color:var(--dim);letter-spacing:.06em;margin-bottom:10px;font-weight:600}
textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;
  color:var(--text);font-family:inherit;font-size:16px;padding:12px 14px;
  resize:none;outline:none;line-height:1.5;
}
textarea:focus{border-color:var(--accent-d)}
textarea::placeholder{color:var(--dim2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line2);color:var(--dim);transition:.15s;
}
.chip:active{background:var(--line2);color:var(--text)}
.personas{display:flex;flex-direction:column;gap:8px}
.persona{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;
  background:var(--panel2);border:1px solid var(--line2);cursor:pointer;transition:.18s;
}
.persona.on{border-color:var(--accent);background:rgba(61,220,151,.09)}
.persona .dot{width:9px;height:9px;border-radius:50%;background:var(--dim2);flex:0 0 9px;transition:.18s}
.persona.on .dot{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.persona .pname{font-size:15px;font-weight:600}
.persona .pdesc{font-size:12.5px;color:var(--dim);margin-top:1px}

/* ---------- 首页 ---------- */
#v-home .scroll{display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top))}
.home-top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.mini-btn{
  background:rgba(20,28,39,.75);border:1px solid var(--line2);color:var(--dim);
  font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.mini-btn:active{background:var(--line2);color:var(--text);transform:scale(.96)}
.brand{padding:20px 4px 26px;text-align:center}
.logo{
  width:64px;height:64px;margin:0 auto 18px;border-radius:20px;
  background:linear-gradient(150deg,rgba(61,220,151,.16),rgba(124,156,255,.10));
  border:1px solid rgba(61,220,151,.28);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.logo svg{width:34px;height:34px;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{font-size:26px;margin:0 0 8px;letter-spacing:.02em;font-weight:700}
.brand .sub{color:var(--dim);font-size:13.5px;margin:0}
.stats{display:flex;gap:10px;margin:6px 0 4px;text-align:center}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-family:var(--mono);font-size:21px;color:var(--accent);font-weight:600}
.stat span{font-size:11.5px;color:var(--dim)}

/* ---------- 顶栏 ---------- */
.bar{
  display:flex;align-items:center;gap:4px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  border-bottom:1px solid var(--line);
  background:rgba(7,10,15,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  flex:0 0 auto;
}
.bar-mid{flex:1;min-width:0;text-align:center}
.bar-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:-1px}

/* ---------- 对话 ---------- */
.msgs{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px;
}
.row{display:flex}
.row.ai{justify-content:flex-start;padding-left:10px}
.row.me{justify-content:flex-end}
.row.ai .bubble{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:4px 16px 16px 16px;padding:11px 15px;max-width:82%;
  font-size:15.5px;white-space:pre-wrap;word-break:break-word;
}
.row.ai .bubble::before{
  content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:2px;border-radius:2px;
  background:hsl(var(--h,160) 82% 58%);
  box-shadow:0 0 8px hsl(var(--h,160) 82% 58% / .55);
}
.row.me .bubble{
  background:linear-gradient(135deg,rgba(61,220,151,.16),rgba(61,220,151,.09));
  border:1px solid rgba(61,220,151,.3);
  border-radius:16px 4px 16px 16px;padding:11px 15px;max-width:82%;
  font-size:15.5px;white-space:pre-wrap;word-break:break-word;
}
.typing{display:inline-flex;gap:4px;align-items:center;height:20px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- 输入区 ---------- */
.composer{
  flex:0 0 auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:rgba(10,14,20,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.composer-inner{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;border-radius:20px;padding:10px 15px;font-size:16px;max-height:132px;background:var(--panel2)}
.mic,.send{
  flex:0 0 42px;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  font-size:17px;display:flex;align-items:center;justify-content:center;transition:.18s;
}
.mic{background:var(--panel2);color:var(--dim);border:1px solid var(--line2)}
.mic.on{background:rgba(255,107,107,.2);color:#ff8f8f;border-color:var(--danger);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.45)}50%{box-shadow:0 0 0 9px rgba(255,107,107,0)}}
.send{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#04140d;font-weight:700;font-size:19px}
.send:disabled{opacity:.35}

/* ---------- 复盘 ---------- */
.score-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 24px}
.ring-box{position:relative;width:136px;height:136px}
.ring{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--panel2)}
.ring .fg{stroke:var(--accent);filter:drop-shadow(0 0 9px rgba(61,220,151,.45));transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.25,1)}
.ring-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:36px;font-weight:600;
}
.ring-cap{font-size:12px;color:var(--dim);letter-spacing:.1em;margin-top:14px}
.score-meta{font-size:13px;color:var(--dim2);margin-top:8px;text-align:center}
.sec{margin-bottom:20px}
.sec-h{font-size:12.5px;color:var(--dim);letter-spacing:.08em;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sec-h::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--line2)}
.sec-h.g::before{background:var(--accent)}
.sec-h.w::before{background:var(--warn)}
.item{
  display:flex;gap:10px;padding:12px 14px;border-radius:13px;margin-bottom:9px;
  background:var(--panel);border:1px solid var(--line);font-size:14.5px;
}
.item .ic{flex:0 0 auto;font-size:14px;line-height:1.65}
.item.g .ic{color:var(--accent)}
.vq{font-size:13px;color:var(--dim);margin-top:6px;padding-left:10px;border-left:2px solid var(--line2);font-style:italic}
.vwhy{font-size:12.5px;color:var(--warn);margin-top:5px}
.next-box{
  background:linear-gradient(135deg,rgba(124,156,255,.14),rgba(124,156,255,.05));
  border:1px solid rgba(124,156,255,.3);border-radius:16px;padding:15px 16px;font-size:15px;
}
.center{text-align:center;color:var(--dim);font-size:14px;padding:40px 20px}
.spin{
  width:26px;height:26px;border:2.5px solid var(--line2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;
}

/* ---------- 历史 ---------- */
.hitem{
  background:var(--panel);border:1px solid var(--line);border-radius:15px;
  padding:14px 16px;margin-bottom:11px;cursor:pointer;transition:.15s;
}
.hitem:active{background:var(--panel2)}
.hitem .ht{font-size:15px;font-weight:600;margin-bottom:5px}
.hitem .hm{font-size:12px;color:var(--dim);font-family:var(--mono);display:flex;gap:10px;align-items:center}
.hitem .hs{margin-left:auto;color:var(--accent);font-weight:600;font-size:14px}

/* ---------- 设置抽屉 ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(3,5,8,.72);backdrop-filter:blur(4px)}
.sheet.on{display:block}
.sheet-body{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--panel);border-top:1px solid var(--line2);
  border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:86dvh;overflow-y:auto;
  animation:up .25s cubic-bezier(.2,.9,.25,1);
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet-h{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center}
.sheet-h button{margin-left:auto;background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:0 4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px;font-weight:600}
.field input{
  width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;
  color:var(--text);font-family:var(--mono);font-size:13.5px;padding:11px 13px;outline:none;
}
.field input:focus{border-color:var(--accent-d)}
.tip{font-size:11.5px;color:var(--dim2);margin-top:6px;line-height:1.55}

/* ---------- toast / 报错 ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:99;
  background:rgba(20,28,39,.97);border:1px solid var(--line2);color:var(--text);
  font-size:14px;padding:11px 18px;border-radius:13px;max-width:82vw;text-align:center;
  opacity:0;pointer-events:none;transition:.24s;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--danger);background:rgba(40,16,18,.97)}
#errbar{
  display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:98;
  background:rgba(46,14,16,.97);border:1px solid var(--danger);color:#ffc9c9;
  font-size:12px;font-family:var(--mono);padding:10px 12px;border-radius:10px;
  max-height:32dvh;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
}
#errbar.on{display:block}
</style>
</head>
<body>

<noscript>
  <div style="padding:40px 24px;text-align:center;color:#e8eef6;font-family:sans-serif">
    <h2>需要 JavaScript</h2>
    <p>这个页面依赖 JavaScript 运行。</p>
    <p>请不要用「文件预览」打开，改用 Safari 或 Chrome 访问。</p>
  </div>
</noscript>

<div id="app">

  <!-- ============ 首页 ============ -->
  <section class="view on" id="v-home">
    <div class="scroll">
      <div class="home-top">
        <button class="mini-btn" id="btn-history">📚 历史</button>
        <button class="mini-btn" id="btn-settings">⚙️ 设置</button>
      </div>

      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/>
            <ellipse cx="12" cy="12" rx="10" ry="4.1"/>
            <ellipse cx="12" cy="12" rx="10" ry="4.1" transform="rotate(60 12 12)"/>
            <ellipse cx="12" cy="12" rx="10" ry="4.1" transform="rotate(120 12 12)"/>
          </svg>
        </div>
        <h1>费曼讲解机</h1>
        <p class="sub">讲到高中生听懂，才算你真的懂</p>
      </div>

      <div class="card">
        <label class="lbl">今天你要讲什么</label>
        <textarea id="topic" rows="2" placeholder="比如：波粒二象性、熵为什么只增不减…"></textarea>
        <div class="chips" id="presets"></div>
      </div>

      <div class="card">
        <label class="lbl">你的听众</label>
        <div class="personas" id="personas"></div>
      </div>

      <button class="btn primary big" id="btn-start">开始讲解</button>

      <div class="stats" id="homeStats"></div>
    </div>
  </section>

  <!-- ============ 对话 ============ -->
  <section class="view" id="v-chat">
    <header class="bar">
      <button class="icon-btn" id="btn-back">←</button>
      <div class="bar-mid">
        <div class="bar-title" id="chatTopic">话题</div>
        <div class="bar-sub" id="chatRounds">还没开始</div>
      </div>
      <button class="icon-btn" id="btn-review" title="结束并复盘">✓</button>
    </header>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="开始讲吧，他什么都不知道…"></textarea>
        <button class="mic" id="btn-mic">🎙</button>
        <button class="send" id="btn-send">↑</button>
      </div>
    </div>
  </section>

  <!-- ============ 复盘 ============ -->
  <section class="view" id="v-review">
    <header class="bar">
      <button class="icon-btn" id="btn-rv-back">←</button>
      <div class="bar-mid"><div class="bar-title">复盘</div></div>
      <button class="icon-btn" id="btn-export">↧</button>
    </header>
    <div class="scroll" id="rvBody"></div>
  </section>

  <!-- ============ 历史 ============ -->
  <section class="view" id="v-history">
    <header class="bar">
      <button class="icon-btn" id="btn-hs-back">←</button>
      <div class="bar-mid"><div class="bar-title">历史复盘</div></div>
      <div style="width:42px"></div>
    </header>
    <div class="scroll" id="hsBody"></div>
  </section>

</div>

<div id="toast"></div>
<div id="errbar"></div>

<!-- ============ 设置 ============ -->
<div class="sheet" id="sheet">
  <div class="sheet-body">
    <div class="sheet-h">设置 <button id="sheet-close">×</button></div>
    <div class="field">
      <label>API 地址（Base URL）</label>
      <input id="cfg-base" placeholder="https://api.deepseek.com/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfg-key" type="password" placeholder="sk-...">
      <div class="tip">只存在你手机本地的 localStorage 里，除了你填的这个 API 之外不会发到别处。</div>
    </div>
    <div class="field">
      <label>模型名</label>
      <input id="cfg-model" placeholder="deepseek-chat">
    </div>
    <button class="btn primary big" id="btn-save-cfg">保存</button>
    <button class="btn ghost" id="btn-clear" style="width:100%;margin-top:10px;color:var(--danger)">清空全部记录</button>
  </div>
</div>

<script>
/* ===================================================================
   费曼讲解机 v1.2
   =================================================================== */

/* ---------------- 错误可见化（放最前面） ---------------- */
const errbar = document.getElementById('errbar');
function showError(msg){
  errbar.textContent = String(msg).slice(0, 400);
  errbar.classList.add('on');
  setTimeout(() => errbar.classList.remove('on'), 12000);
}
window.onerror = function(msg, src, line, col){
  showError('脚本错误 L' + line + ':' + col + '\n' + msg);
  return false;
};
window.addEventListener('unhandledrejection', function(e){
  const r = e.reason;
  showError('请求/异步错误\n' + (r && r.message ? r.message : r));
});

/* ---------------- 工具 ---------------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

let toastTimer;
function toast(msg, isErr){
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ---------------- 本地存储 ---------------- */
const LS_CFG = 'feynman.cfg.v1';
const LS_SES = 'feynman.ses.v1';
const LS_STAT = 'feynman.stat.v1';

function readJSON(key, fallback){
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    const v = JSON.parse(raw);
    return (v === null || v === undefined) ? fallback : v;
  } catch(e){
    return fallback;
  }
}
function writeJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast('本地存储不可用，数据无法保存', true); return false; }
}

let cfg = Object.assign(
  { base:'https://api.deepseek.com/v1', key:'', model:'deepseek-chat', persona:'hs' },
  readJSON(LS_CFG, {})
);
let sessions = readJSON(LS_SES, []);
if (!Array.isArray(sessions)) sessions = [];

let stats = Object.assign({ sessions:0, cleared:0, vague:0 }, readJSON(LS_STAT, {}));

const saveCfg      = () => writeJSON(LS_CFG, cfg);
const saveSessions = () => writeJSON(LS_SES, sessions.slice(0, 80));
const saveStats    = () => writeJSON(LS_STAT, stats);

/* ---------------- 人设 ---------------- */
const PERSONAS = {
  hs:      { name:'高二 · 小北', desc:'聪明爱较真，物理只到高中水平' },
  skeptic: { name:'杠精 · 小北', desc:'专挑矛盾，你说什么他都要反问' },
  novice:  { name:'文科 · 小北', desc:'一窍不通，连「力」和「能量」都分不清' }
};

const PERSONA_EXTRA = {
  hs:      '你聪明、逻辑清楚、记性很好，会牢牢记住他三句话之前说过什么。',

/* ---------------- API ---------------- */
async function callAPI(messages, opts){
  if (!cfg.key) throw new Error('还没填 API Key，去设置里填一下');
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + cfg.key
    },
    body: JSON.stringify(Object.assign({
      model: cfg.model,
      messages: messages,
      temperature: 0.85,
      max_tokens: 700
    }, opts || {}))
  });
  if (!res.ok){
    let m = 'HTTP ' + res.status;
    try {
      const j = await res.json();
      if (j && j.error && j.error.message) m = j.error.message;
    } catch(e){}
    throw new Error(m);
  }
  return res;
}

async function streamChat(messages, onDelta, opts){
  const res = await callAPI(messages, Object.assign({ stream:true }, opts || {}));

  if (!res.body || !res.body.getReader){
    const j = await res.json();
    const txt = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    onDelta(txt);
    return txt;
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '';
  while (true){
    const r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, { stream:true });
    const lines = buf.split('\n');
    buf = lines.pop() || '';
    for (let i = 0; i < lines.length; i++){
      const line = lines[i].trim();
      if (!line || line.indexOf('data:') !== 0) continue;
      const payload = line.slice(5).trim();
      if (!payload || payload === '[DONE]') continue;
      try {
        const j = JSON.parse(payload);
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (d){ full += d; onDelta(full); }
      } catch(e){}
    }
  }
  return full;
}

async function chatOnce(messages, opts){
  const res = await callAPI(messages, Object.assign({ stream:false }, opts || {}));
  const j = await res.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
}

/* ---------------- 会话状态 ---------------- */
let session = null;
let current = null;
let busy = false;

const msgsEl  = $('#msgs');
const inputEl = $('#input');

function scrollDown(){
  requestAnimationFrame(() => { msgsEl.scrollTop = msgsEl.scrollHeight; });
}

function roundCount(s){
  const t = s || session;
  if (!t || !t.messages) return 0;
  return t.messages.filter(m => m.role === 'assistant' && m.content).length;
}

function renderMessages(){
  if (!session) return;
  const html = [];
  let n = 0;
  session.messages.forEach(m => {
    if (m.role === 'system') return;
    if (m.role === 'user'){
      html.push('<div class="row me"><div class="bubble">' + esc(m.content) + '</div></div>');
    } else {
      n++;
      const hue = Math.max(2, 158 - (n - 1) * 17);
      const inner = m.content
        ? esc(m.content)
        : '<span class="typing"><i></i><i></i><i></i></span>';
      html.push('<div class="row ai" style="--h:' + hue + '"><div class="bubble">' + inner + '</div></div>');
    }
  });
  msgsEl.innerHTML = html.join('');
  const r = roundCount();
  $('#chatRounds').textContent = r ? ('第 ' + r + ' 次追问') : '他还没开口';
  scrollDown();
}

function updateLastAI(text){
  const rows = msgsEl.querySelectorAll('.row.ai .bubble');
  const el = rows[rows.length - 1];
  if (el) el.textContent = text;
  scrollDown();
}

function startSession(topic){
  session = {
    id: 'S' + Date.now(),
    topic: topic,
    startedAt: Date.now(),
    messages: [
      { role:'system', content: buildSystemPrompt() },
      { role:'assistant', content:
        '行，你要给我讲「' + topic + '」。那我先说清楚：我什么都不知道，你从头讲。\n听不懂我会打断你的。' }
    ]
  };
  current = session;
  $('#chatTopic').textContent = topic;
  show('v-chat');
  renderMessages();
  inputEl.value = '';
  autoGrow();
}

/* ---------------- 发送 ---------------- */
async function send(){
  const text = inputEl.value.trim();
  if (!text || busy || !session) return;

  inputEl.value = '';
  autoGrow();

  session.messages.push({ role:'user', content: text });
  renderMessages();

  const payload = session.messages.map(m => ({ role:m.role, content:m.content }));
  session.messages.push({ role:'assistant', content: '' });
  renderMessages();

  busy = true;
  $('#btn-send').disabled = true;
  try {
    const full = await streamChat(payload, updateLastAI, { temperature:0.9, max_tokens:400 });
    session.messages[session.messages.length - 1].content = full.trim() || '（他没说话）';
  } catch(e){
    session.messages.pop();
    toast('出错了：' + e.message, true);
  }
  busy = false;
  $('#btn-send').disabled = false;
  renderMessages();
}

/* ---------------- 复盘 ---------------- */
const FENCE = '`'.repeat(3);

function extractJSON(s){
  let t = String(s).split(FENCE).join('').trim();
  const a = t.indexOf('{');
  const b = t.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('返回内容无法解析，再点一次复盘试试');
  return JSON.parse(t.slice(a, b + 1));
}

async function doReview(){
  if (!session) return;
  const userTurns = session.messages.filter(m => m.role === 'user').length;
  if (userTurns < 2){ toast('至少先讲两轮再复盘吧'); return; }

  show('v-review');
  $('#rvBody').innerHTML = '<div class="center"><div class="spin"></div>助教正在翻你的讲解记录…</div>';

  try {
    const history = session.messages
      .filter(m => m.role !== 'system' && m.content && m.content.trim())
      .map(m => ({ role: m.role, content: m.content }));

    const msgs = [{ role:'system', content: REVIEW_SYSTEM }]
      .concat(history)
      .concat([{ role:'user', content: REVIEW_PROMPT }]);

    const out = await chatOnce(msgs, { temperature:0.3, max_tokens:900 });
    const data = extractJSON(out);

    session.review = data;
    sessions.unshift({
      id: session.id,
      topic: session.topic,
      at: session.startedAt,
      review: data,
      turns: userTurns,
      rounds: roundCount(session)
    });
    saveSessions();

    stats.sessions += 1;
    stats.cleared += (data.cleared || []).length;
    stats.vague  += (data.vague || []).length;
    saveStats();

    current = session;
    renderReview(session);
  } catch(e){
    $('#rvBody').innerHTML =
      '<div class="center">复盘失败：' + esc(e.message)
      + '<br><br><button class="btn ghost" style="max-width:200px;margin:0 auto" id="rv-fail">回到讲解</button></div>';
    const b = $('#rv-fail');
    if (b) b.onclick = () => show('v-chat');
  }
}
